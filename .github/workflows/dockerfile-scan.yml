name: Dockerfile Security Scan

on:
  push:
    branches:
      - main
    paths:
      - 'node-frontend/**'
      - 'python-orders/**'
      - 'go-inventory/**'
      - '.trivy/**'
      - '.github/workflows/dockerfile-scan.yml'
  pull_request:
    paths:
      - 'node-frontend/**'
      - 'python-orders/**'
      - 'go-inventory/**'
      - '.trivy/**'
      - '.github/workflows/dockerfile-scan.yml'

permissions:
  contents: read
  security-events: write

env:
  DD_BUILD_ID: ${{ github.run_number }}
  DD_BRANCH: ${{ github.ref_name }}
  DD_COMMIT: ${{ github.sha }}

  DD_PRODUCT_TYPE: SP Org
  DD_PRODUCT: Otel Labs
  DD_ENGAGEMENT: Platform Sec Engagement
  DD_ENVIRONMENT: Lab

jobs:
  dockerfile-scan:
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Scan Dockerfiles using centralized Trivy configuration
      - name: Scan Node Frontend Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./node-frontend
          format: sarif
          output: trivy-node-frontend-dockerfile.sarif
          trivy-config: .trivy/config.yaml
          exit-code: 0

      - name: Scan Python Orders Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./python-orders
          format: sarif
          output: trivy-python-orders-dockerfile.sarif
          trivy-config: .trivy/config.yaml
          exit-code: 0

      - name: Scan Go Inventory Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./go-inventory
          format: sarif
          output: trivy-go-inventory-dockerfile.sarif
          trivy-config: .trivy/config.yaml
          exit-code: 0

      # Upload Dockerfile SARIF Reports
      - name: Upload node-frontend Dockerfile SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-node-frontend-dockerfile.sarif
          category: trivy-node-frontend-dockerfile

      - name: Upload python-orders Dockerfile SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-python-orders-dockerfile.sarif
          category: trivy-python-orders-dockerfile

      - name: Upload go-inventory Dockerfile SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-go-inventory-dockerfile.sarif
          category: trivy-go-inventory-dockerfile

      - name: Upload Node Frontend Dockerfile Results to DefectDojo
        if: always()
        run: |
          curl -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -H "Accept: application/json" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-node-frontend-dockerfile.sarif" \
            -F "auto_create_context=true" \
            -F "product_type_name=$DD_PRODUCT_TYPE" \
            -F "product_name=$DD_PRODUCT" \
            -F "engagement_name=$DD_ENGAGEMENT" \
            -F "test_title=Trivy Node Frontend Dockerfile" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" \
            -F "environment=$DD_ENVIRONMENT" \
            -F "build_id=$DD_BUILD_ID" \
            -F "branch_tag=$DD_BRANCH" \
            -F "commit_hash=$DD_COMMIT" \
            -F "tags=github-actions,trivy,dockerfile,node-frontend,$DD_BRANCH"

      - name: Upload Python Orders Dockerfile Results to DefectDojo
        if: always()
        run: |
          curl -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -H "Accept: application/json" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-python-orders-dockerfile.sarif" \
            -F "auto_create_context=true" \
            -F "product_type_name=$DD_PRODUCT_TYPE" \
            -F "product_name=$DD_PRODUCT" \
            -F "engagement_name=$DD_ENGAGEMENT" \
            -F "test_title=Trivy Python Orders Dockerfile" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" \
            -F "environment=$DD_ENVIRONMENT" \
            -F "build_id=$DD_BUILD_ID" \
            -F "branch_tag=$DD_BRANCH" \
            -F "commit_hash=$DD_COMMIT" \
            -F "tags=github-actions,trivy,dockerfile,python-orders,$DD_BRANCH"

      - name: Upload Go Inventory Dockerfile Results to DefectDojo
        if: always()
        run: |
          curl -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -H "Accept: application/json" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-go-inventory-dockerfile.sarif" \
            -F "auto_create_context=true" \
            -F "product_type_name=$DD_PRODUCT_TYPE" \
            -F "product_name=$DD_PRODUCT" \
            -F "engagement_name=$DD_ENGAGEMENT" \
            -F "test_title=Trivy Go Inventory Dockerfile" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" \
            -F "environment=$DD_ENVIRONMENT" \
            -F "build_id=$DD_BUILD_ID" \
            -F "branch_tag=$DD_BRANCH" \
            -F "commit_hash=$DD_COMMIT" \
            -F "tags=github-actions,trivy,dockerfile,go-inventory,$DD_BRANCH"