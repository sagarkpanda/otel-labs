name: Build and Push Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.dockerignore'
      - '.env.example'
      - 'LICENSE'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      GHCR_OWNER: ${{ github.repository_owner }}
      RUN_TAG: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build latest images
        env:
          IMAGE_TAG: latest
        run: docker compose build

      - name: Tag run-number images
        run: |
          docker tag ghcr.io/${GHCR_OWNER}/node-frontend:latest ghcr.io/${GHCR_OWNER}/node-frontend:${RUN_TAG}
          docker tag ghcr.io/${GHCR_OWNER}/python-orders:latest ghcr.io/${GHCR_OWNER}/python-orders:${RUN_TAG}
          docker tag ghcr.io/${GHCR_OWNER}/go-inventory:latest ghcr.io/${GHCR_OWNER}/go-inventory:${RUN_TAG}

      - name: Push latest images
        env:
          IMAGE_TAG: latest
        run: docker compose push

      - name: Push run-number images
        run: |
          docker push ghcr.io/${GHCR_OWNER}/node-frontend:${RUN_TAG}
          docker push ghcr.io/${GHCR_OWNER}/python-orders:${RUN_TAG}
          docker push ghcr.io/${GHCR_OWNER}/go-inventory:${RUN_TAG}