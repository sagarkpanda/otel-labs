# Centralized Trivy configuration for the otel-labs application repository.
#
# Used by:
# - Container image scans
# - Dockerfile/configuration scans
#
# Secrets are intentionally excluded from Trivy.
# Gitleaks is the dedicated secret scanner for this repository.

severity:
  - HIGH
  - CRITICAL

scanners:
  - vuln
  - misconfig

format: sarif

vulnerability:
  ignore-unfixed: true

# Limit SARIF output to the severity levels configured above (HIGH, CRITICAL).
# By default, Trivy may include findings of all severity levels in SARIF output,
# even when the severity setting is restricted.
limit-severities-for-sarif: true