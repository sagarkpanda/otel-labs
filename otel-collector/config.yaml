receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

processors:
  resource:
    attributes:
      - key: deployment.environment
        value: lab
        action: upsert

  batch:

exporters:
  debug:
    verbosity: detailed

  otlphttp/newrelic:
    endpoint: https://otlp.eu01.nr-data.net

    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}

  otlphttp/honeycomb:
    endpoint: https://api.honeycomb.io

    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}

service:
  pipelines:

    traces:
      receivers:
        - otlp

      processors:
        - resource
        - batch

      exporters:
        - debug
        - otlphttp/newrelic
        - otlphttp/honeycomb

    metrics:
      receivers:
        - otlp

      processors:
        - resource
        - batch

      exporters:
        - debug
        - otlphttp/newrelic
        - otlphttp/honeycomb

    logs:
      receivers:
        - otlp

      processors:
        - resource
        - batch

      exporters:
        - debug
        - otlphttp/newrelic
        - otlphttp/honeycomb