receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

  otlp_http/honeycomb:
    endpoint: https://api.honeycomb.io
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/honeycomb]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/honeycomb]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/honeycomb]