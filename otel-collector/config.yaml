receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

  datadog:
    api:
      site: ap1.datadoghq.com
      key: ${env:DD_API_KEY}

service:

  pipelines:

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - debug
        - datadog

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - debug
        - datadog

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - debug
        - datadog