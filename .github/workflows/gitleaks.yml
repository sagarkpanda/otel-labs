name: Gitleaks

on:
  push:
    branches:
      - main
    paths-ignore:
    - '**/*.md'
    - '.gitignore'
    - 'LICENSE'
    - 'docs/**'
    - 'images/**'
    - '.github/ISSUE_TEMPLATE/**'
    - '.github/PULL_REQUEST_TEMPLATE.md'

permissions:
  contents: read
  security-events: write

env:
  DD_BUILD_ID: ${{ github.run_number }}
  DD_BRANCH: ${{ github.ref_name }}
  DD_COMMIT: ${{ github.sha }}

  DD_PRODUCT_TYPE: SP Org
  DD_PRODUCT: Otel Labs
  DD_ENGAGEMENT: App Sec Engagement
  DD_ENVIRONMENT: Lab

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run Gitleaks (git history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_RESULTS: true

      - name: Run Gitleaks (full filesystem)
        if: always()
        run: |
          docker run --rm -v "$PWD:/path" ghcr.io/gitleaks/gitleaks:latest \
            dir /path --report-format sarif \
            --report-path /path/gitleaks-fs.sarif --exit-code 0

          docker run --rm -v "$PWD:/path" ghcr.io/gitleaks/gitleaks:latest \
            dir /path --report-format json \
            --report-path /path/gitleaks-fs.json --exit-code 0

      - name: Add filesystem scan summary
        if: always()
        run: |
          echo "## Gitleaks Filesystem Scan" >> "$GITHUB_STEP_SUMMARY"
          if [ -s gitleaks-fs.json ] && [ "$(cat gitleaks-fs.json)" != "[]" ]; then
            COUNT=$(jq length gitleaks-fs.json)
            echo "⚠️ Found **$COUNT** potential secret(s) in working tree files." >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "- `\(.File)` (rule: \(.RuleID))"' gitleaks-fs.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No secrets found in filesystem scan." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload filesystem scan artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-filesystem-results
          path: |
            gitleaks-fs.sarif
            gitleaks-fs.json
          retention-days: 30

      - name: Upload SARIF (filesystem)
        if: always()
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          sarif_file: gitleaks-fs.sarif
          category: gitleaks-fs

      - name: Upload Gitleaks to DefectDojo
        if: always()
        run: |
          RESPONSE=$(curl --fail --show-error --silent \
            -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -H "Accept: application/json" \
            -F "scan_type=SARIF" \
            -F "file=@gitleaks-fs.sarif" \
            -F "auto_create_context=true" \
            -F "product_type_name=$DD_PRODUCT_TYPE" \
            -F "product_name=$DD_PRODUCT" \
            -F "engagement_name=$DD_ENGAGEMENT" \
            -F "test_title=Gitleaks" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" \
            -F "environment=$DD_ENVIRONMENT" \
            -F "build_id=$DD_BUILD_ID" \
            -F "branch_tag=$DD_BRANCH" \
            -F "commit_hash=$DD_COMMIT" \
            -F "tags=github-actions,gitleaks,$DD_BRANCH")
          echo "$RESPONSE"