# Build, Scan and Push Images - Refactored with Centralized Trivy Config
#
# Trivy scans:
# - vuln: scans OS and application packages in the image for known CVEs.
# - misconfig: scans the image filesystem for security misconfigurations.
# - image-config-scanners: scans the image configuration for hardening issues,
#   such as running as root / missing non-root USER configuration.
#
# Trivy FS is used separately to scan files in the repository rather than
# the built image. It is used for areas such as:
# - Terraform/IaC misconfigurations
# - Kubernetes manifests
# - Dockerfiles and other configuration files
#
# Trivy also supports secret scanning, but it is intentionally not enabled here.
# Secrets are handled separately by Gitleaks across the repository, including
# Dockerfiles. This keeps secret detection owned by a single dedicated tool.

name: Build, Scan and Push Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.dockerignore'
      - '.env.example'
      - 'LICENSE'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'images/**'

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    env:
      GHCR_OWNER: ${{ github.repository_owner }}
      TRIVY_CONFIG: .trivy/trivy.yaml

    steps:
      - name: Checkout application repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate short SHA tag
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build latest images
        env:
          IMAGE_TAG: latest
        run: docker compose build

      - name: Tag SHA images
        run: |
          docker tag ghcr.io/${GHCR_OWNER}/node-frontend:latest ghcr.io/${GHCR_OWNER}/node-frontend:${SHORT_SHA}
          docker tag ghcr.io/${GHCR_OWNER}/python-orders:latest ghcr.io/${GHCR_OWNER}/python-orders:${SHORT_SHA}
          docker tag ghcr.io/${GHCR_OWNER}/go-inventory:latest ghcr.io/${GHCR_OWNER}/go-inventory:${SHORT_SHA}

      # Scan Docker images using centralized config
      - name: Scan node-frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.GHCR_OWNER }}/node-frontend:latest
          format: sarif
          output: trivy-node-frontend.sarif
          ttrivy-config: .trivy/config.yaml
          exit-code: 0

      - name: Scan python-orders image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.GHCR_OWNER }}/python-orders:latest
          format: sarif
          output: trivy-python-orders.sarif
          ttrivy-config: .trivy/config.yaml
          exit-code: 0

      - name: Scan go-inventory image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.GHCR_OWNER }}/go-inventory:latest
          format: sarif
          output: trivy-go-inventory.sarif
          ttrivy-config: .trivy/config.yaml
          exit-code: 0

      - name: Scan OpenTelemetry Collector image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: otel/opentelemetry-collector-contrib:0.131.0
          format: sarif
          output: trivy-otel-collector.sarif
          ttrivy-config: .trivy/config.yaml
          exit-code: 0

      # Scan Dockerfiles using centralized config
      - name: Scan Node Frontend Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./node-frontend
          format: sarif
          output: trivy-node-frontend-dockerfile.sarif
          ttrivy-config: .trivy/config.yaml
          exit-code: 0

      - name: Scan Python Orders Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./python-orders
          format: sarif
          output: trivy-python-orders-dockerfile.sarif
          ttrivy-config: .trivy/config.yaml
          exit-code: 0

      - name: Scan Go Inventory Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./go-inventory
          format: sarif
          output: trivy-go-inventory-dockerfile.sarif
          ttrivy-config: .trivy/config.yaml
          exit-code: 0

      # Upload Image SARIF Reports
      - name: Upload node-frontend image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-node-frontend.sarif
          category: trivy-node-frontend-image
          delete-old-findings: true

      - name: Upload python-orders image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-python-orders.sarif
          category: trivy-python-orders-image
          delete-old-findings: true

      - name: Upload go-inventory image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-go-inventory.sarif
          category: trivy-go-inventory-image
          delete-old-findings: true

      - name: Upload otel-collector image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-otel-collector.sarif
          category: trivy-otel-collector-image
          delete-old-findings: true

      # Upload Dockerfile SARIF Reports
      - name: Upload node-frontend Dockerfile SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-node-frontend-dockerfile.sarif
          category: trivy-node-frontend-dockerfile
          delete-old-findings: true

      - name: Upload python-orders Dockerfile SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-python-orders-dockerfile.sarif
          category: trivy-python-orders-dockerfile
          delete-old-findings: true

      - name: Upload go-inventory Dockerfile SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-go-inventory-dockerfile.sarif
          category: trivy-go-inventory-dockerfile
          delete-old-findings: true

      # Generate SBOMs
      - name: Generate Node Frontend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.GHCR_OWNER }}/node-frontend:latest
          format: cyclonedx
          output: node-frontend-sbom.json

      - name: Generate Python Orders SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.GHCR_OWNER }}/python-orders:latest
          format: cyclonedx
          output: python-orders-sbom.json

      - name: Generate Go Inventory SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.GHCR_OWNER }}/go-inventory:latest
          format: cyclonedx
          output: go-inventory-sbom.json

      - name: Generate OpenTelemetry Collector SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: otel/opentelemetry-collector-contrib:0.131.0
          format: cyclonedx
          output: otel-collector-sbom.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            node-frontend-sbom.json
            python-orders-sbom.json
            go-inventory-sbom.json
            otel-collector-sbom.json

      # Upload to DefectDojo (Image Scans)
      - name: Upload Node Frontend Image Results to DefectDojo
        if: always()
        run: |
          curl -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -H "Accept: application/json" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-node-frontend.sarif" \
            -F "auto_create_context=true" \
            -F "product_type_name=SP Org" \
            -F "product_name=Otel Labs" \
            -F "engagement_name=App Sec Engagement" \
            -F "test_title=Trivy Node Frontend Image" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" \
            -F "environment=Lab" \
            -F "build_id=${{ github.run_number }}" \
            -F "branch_tag=${{ github.ref_name }}" \
            -F "commit_hash=${{ github.sha }}" \
            -F "tags=github-actions,trivy,image,node-frontend,${{ github.ref_name }}"

      - name: Upload Python Orders Image Results to DefectDojo
        if: always()
        run: |
          curl -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -H "Accept: application/json" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-python-orders.sarif" \
            -F "auto_create_context=true" \
            -F "product_type_name=SP Org" \
            -F "product_name=Otel Labs" \
            -F "engagement_name=App Sec Engagement" \
            -F "test_title=Trivy Python Orders Image" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" \
            -F "environment=Lab" \
            -F "build_id=${{ github.run_number }}" \
            -F "branch_tag=${{ github.ref_name }}" \
            -F "commit_hash=${{ github.sha }}" \
            -F "tags=github-actions,trivy,image,python-orders,${{ github.ref_name }}"

      - name: Upload Go Inventory Image Results to DefectDojo
        if: always()
        run: |
          curl -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -H "Accept: application/json" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-go-inventory.sarif" \
            -F "auto_create_context=true" \
            -F "product_type_name=SP Org" \
            -F "product_name=Otel Labs" \
            -F "engagement_name=App Sec Engagement" \
            -F "test_title=Trivy Go Inventory Image" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" \
            -F "environment=Lab" \
            -F "build_id=${{ github.run_number }}" \
            -F "branch_tag=${{ github.ref_name }}" \
            -F "commit_hash=${{ github.sha }}" \
            -F "tags=github-actions,trivy,image,go-inventory,${{ github.ref_name }}"

      - name: Upload OpenTelemetry Collector Image Results to DefectDojo
        if: always()
        run: |
          curl -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -H "Accept: application/json" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-otel-collector.sarif" \
            -F "auto_create_context=true" \
            -F "product_type_name=SP Org" \
            -F "product_name=Otel Labs" \
            -F "engagement_name=App Sec Engagement" \
            -F "test_title=Trivy OpenTelemetry Collector Image" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" \
            -F "environment=Lab" \
            -F "build_id=${{ github.run_number }}" \
            -F "branch_tag=${{ github.ref_name }}" \
            -F "commit_hash=${{ github.sha }}" \
            -F "tags=github-actions,trivy,image,otel-collector,${{ github.ref_name }}"

      # Upload to DefectDojo (Dockerfile Scans)
      - name: Upload Node Frontend Dockerfile Results to DefectDojo
        if: always()
        run: |
          curl -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -H "Accept: application/json" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-node-frontend-dockerfile.sarif" \
            -F "auto_create_context=true" \
            -F "product_type_name=SP Org" \
            -F "product_name=Otel Labs" \
            -F "engagement_name=App Sec Engagement" \
            -F "test_title=Trivy Node Frontend Dockerfile" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" \
            -F "environment=Lab" \
            -F "build_id=${{ github.run_number }}" \
            -F "branch_tag=${{ github.ref_name }}" \
            -F "commit_hash=${{ github.sha }}" \
            -F "tags=github-actions,trivy,dockerfile,node-frontend,${{ github.ref_name }}"

      - name: Upload Python Orders Dockerfile Results to DefectDojo
        if: always()
        run: |
          curl -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -H "Accept: application/json" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-python-orders-dockerfile.sarif" \
            -F "auto_create_context=true" \
            -F "product_type_name=SP Org" \
            -F "product_name=Otel Labs" \
            -F "engagement_name=App Sec Engagement" \
            -F "test_title=Trivy Python Orders Dockerfile" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" \
            -F "environment=Lab" \
            -F "build_id=${{ github.run_number }}" \
            -F "branch_tag=${{ github.ref_name }}" \
            -F "commit_hash=${{ github.sha }}" \
            -F "tags=github-actions,trivy,dockerfile,python-orders,${{ github.ref_name }}"

      - name: Upload Go Inventory Dockerfile Results to DefectDojo
        if: always()
        run: |
          curl -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -H "Accept: application/json" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-go-inventory-dockerfile.sarif" \
            -F "auto_create_context=true" \
            -F "product_type_name=SP Org" \
            -F "product_name=Otel Labs" \
            -F "engagement_name=App Sec Engagement" \
            -F "test_title=Trivy Go Inventory Dockerfile" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" \
            -F "environment=Lab" \
            -F "build_id=${{ github.run_number }}" \
            -F "branch_tag=${{ github.ref_name }}" \
            -F "commit_hash=${{ github.sha }}" \
            -F "tags=github-actions,trivy,dockerfile,go-inventory,${{ github.ref_name }}"

      - name: Push latest images
        env:
          IMAGE_TAG: latest
        run: docker compose push

      - name: Push SHA images
        run: |
          docker push ghcr.io/${GHCR_OWNER}/node-frontend:${SHORT_SHA}
          docker push ghcr.io/${GHCR_OWNER}/python-orders:${SHORT_SHA}
          docker push ghcr.io/${GHCR_OWNER}/go-inventory:${SHORT_SHA}

      - name: Checkout manifest repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sagarkpanda/otel-labs-platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: otel-labs-platform

      - name: Update image tags in manifest repo
        run: |
          cd otel-labs-platform

          sed -i "s/newTag:.*/newTag: \"${SHORT_SHA}\"/" \
            k8s/node-frontend/kustomization.yml

          sed -i "s/newTag:.*/newTag: \"${SHORT_SHA}\"/" \
            k8s/python-orders/kustomization.yml

          sed -i "s/newTag:.*/newTag: \"${SHORT_SHA}\"/" \
            k8s/go-inventory/kustomization.yml

      - name: Commit and push manifest changes
        run: |
          cd otel-labs-platform

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update image tags to ${SHORT_SHA}"

          git push